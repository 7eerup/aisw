<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>회원가입</title>
</head>

<body>
  <h1>회원가입</h1>

  {% if error %}
  <p>{{ error }}</p>
  {% endif %}

  <form action="/signup" method="post">
    <p>
      <label for="username">아이디</label>
      <input
        id="username"
        name="username"
        type="text"
        value="{{ username }}"
        required
      />
    </p>

    <p>
      <label for="name">이름</label>
      <input
        id="name"
        name="name"
        type="text"
        value="{{ name }}"
        required
      />
    </p>

    <p>
      <label for="password">비밀번호</label>
      <input
        id="password"
        name="password"
        type="password"
        minlength="4"
        required
      />
    </p>

    <p>
      <label for="password_confirm">
        비밀번호 확인
      </label>
      <input
        id="password_confirm"
        name="password_confirm"
        type="password"
        minlength="4"
        required
      />
    </p>

    <button type="submit">가입하기</button>
  </form>

  <p>
    이미 계정이 있으신가요?
    <a href="/login">로그인</a>
  </p>
</body>

</html>
