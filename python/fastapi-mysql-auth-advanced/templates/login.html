<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>

<body>

    <h1>로그인</h1>

    {% if success %}
    <p><strong>{{ success }}</strong></p>
    {% endif %}

    <hr>

    {% if error %}
    <p>
        <strong>{{ error }}</strong>
    </p>
    {% endif %}

    <form action="/login" method="post">

        <p>
            <label for="username">아이디</label>
        </p>

        <input type="text" id="username" name="username" value="{{ username if username is defined else '' }}" required>

        <p>
            <label for="password">비밀번호</label>
        </p>

        <input type="password" id="password" name="password" required>

        <p>
            <button type="submit">로그인</button>
            <button type="button" onclick="location.href='/auth/github'">
                GitHub 로그인
            </button>
            <button type="button" onclick="location.href='/auth/google'">
                Google 로그인
            </button>
        </p>
    </form>

    <p>
        계정이 없으신가요?
        <button type="button" onclick="location.href='/signup'">회원가입</button>
    </p>

</body>

</html>
