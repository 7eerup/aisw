<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<body>
    <h1>로그인</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form action="/login" method="post">
        <div>
            <label>아이디</label><br>
            <input
                type="text"
                name="username"
                placeholder="아이디를 입력하세요"
                required
            >
        </div>

        <br>

        <div>
            <label>비밀번호</label><br>
            <input
                type="password"
                name="password"
                placeholder="비밀번호를 입력하세요"
                required
            >
        </div>

        <br>

        <button type="submit">로그인</button>
        <a href="/">홈으로</a>
    </form>
</body>
</html>
