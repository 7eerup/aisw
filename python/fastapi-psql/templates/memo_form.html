<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>메모 작성</title>
</head>

<body>
  {% if memo %}
  <h1>메모 수정</h1>
  {% else %}
  <h1>새 메모 작성</h1>
  {% endif %} {% if error %}
  <p style="color: red">{{ error }}</p>
  {% endif %}

  <form action="{{ action }}" method="post">
    <label>카테고리</label>

    <select name="category_id">
      <option value="">선택하세요</option>

      {% for category in categories %}
      <option value="{{ category.id }}" {% if memo and memo.category_id==category.id %}selected{% endif %}>
        {{ category.name }}
      </option>
      {% endfor %}
    </select>

    <div>
      <label for="title">제목</label><br />
      <input type="text" id="title" name="title" value="{{ memo.title if memo else '' }}" />
    </div>

    <div>
      <label for="content">내용</label><br />
      <textarea id="content" name="content" rows="5">
{{ memo.content if memo else '' }}</textarea>
    </div>

    <button type="submit">저장</button>
    <button type="button" onclick="location.href='/memos'">취소</button>
  </form>
</body>

</html>
