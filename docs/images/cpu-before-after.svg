<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; fill:#111827; }
    .title{font-size:46px;font-weight:800}.sub{font-size:24px;fill:#4b5563}.h{font-size:30px;font-weight:800;fill:white}
    .step{font-size:25px;font-weight:700}.small{font-size:22px}.note{font-size:24px;font-weight:700}
  </style>
  <text x="600" y="62" text-anchor="middle" class="title">CPU Before / After</text>
  <text x="600" y="98" text-anchor="middle" class="sub">CPU_MAX_OCCUPY 변경에 따른 Watchdog 동작 차이</text>

  <rect x="45" y="130" width="530" height="450" rx="18" fill="#fff7f7" stroke="#dc2626" stroke-width="3"/>
  <rect x="45" y="130" width="530" height="62" rx="18" fill="#dc2626"/>
  <rect x="45" y="174" width="530" height="18" fill="#dc2626"/>
  <text x="310" y="172" text-anchor="middle" class="h">Before</text>
  <text x="85" y="232" class="step">1. CPU_MAX_OCCUPY = 100%</text>
  <text x="85" y="282" class="step">2. Current Load 5.00% → 51.62%</text>
  <text x="85" y="332" class="step">3. CPU Threshold Violated</text>
  <text x="85" y="382" class="step">4. WATCHDOG 동작</text>
  <text x="85" y="432" class="step">5. SIGTERM</text>
  <text x="85" y="482" class="step">6. Terminated</text>
  <rect x="400" y="280" width="95" height="200" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <rect x="420" y="360" width="55" height="105" rx="10" fill="#ef4444"/>
  <line x1="390" y1="365" x2="510" y2="365" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="450" y="350" text-anchor="middle" class="small" fill="#b91c1c">51.62%</text>
  <text x="310" y="535" text-anchor="middle" class="note" fill="#b91c1c">50% 보호선 초과 → 강제 종료</text>

  <rect x="625" y="130" width="530" height="450" rx="18" fill="#f4fff8" stroke="#059669" stroke-width="3"/>
  <rect x="625" y="130" width="530" height="62" rx="18" fill="#059669"/>
  <rect x="625" y="174" width="530" height="18" fill="#059669"/>
  <text x="890" y="172" text-anchor="middle" class="h">After</text>
  <text x="665" y="232" class="step">1. CPU_MAX_OCCUPY = 50%</text>
  <text x="665" y="282" class="step">2. Current Load 5.00% → 49.88%</text>
  <text x="665" y="332" class="step">3. Peak reached (50.00%)</text>
  <text x="665" y="382" class="step">4. Cooldown 시작</text>
  <text x="665" y="432" class="step">5. CPU Load 감소</text>
  <text x="665" y="482" class="step">6. 프로세스 계속 생존</text>
  <polyline points="980,305 1030,335 1010,380 980,420 945,455" fill="none" stroke="#10b981" stroke-width="7"/>
  <circle cx="980" cy="305" r="8" fill="#10b981"/><circle cx="1030" cy="335" r="8" fill="#10b981"/><circle cx="1010" cy="380" r="8" fill="#10b981"/><circle cx="980" cy="420" r="8" fill="#10b981"/><circle cx="945" cy="455" r="8" fill="#10b981"/>
  <text x="1035" y="324" class="small" fill="#047857">50%</text>
  <text x="890" y="535" text-anchor="middle" class="note" fill="#047857">Peak → Cooldown → 안정화</text>

  <rect x="115" y="610" width="970" height="60" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="649" text-anchor="middle" class="note">결론: 100% → 50%로 제한하면 50%에서 Cooldown이 작동해 Watchdog 강제 종료를 방지</text>
</svg>