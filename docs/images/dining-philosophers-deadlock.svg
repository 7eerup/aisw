<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; fill:#111827; }
    .title{font-size:44px;font-weight:800}.sub{font-size:24px;fill:#4b5563}.label{font-size:22px;font-weight:700}.small{font-size:20px}.note{font-size:24px;font-weight:700}
  </style>
  <text x="600" y="58" text-anchor="middle" class="title">Deadlock 이해: 식사하는 철학자 문제</text>
  <text x="600" y="95" text-anchor="middle" class="sub">철학자 = Thread · 포크 = 공유 자원(Lock)</text>

  <circle cx="410" cy="385" r="230" fill="#d6a96f" stroke="#8b5e34" stroke-width="5"/>
  <circle cx="410" cy="385" r="70" fill="#f3e8d3" stroke="#8b5e34" stroke-width="3"/>
  <text x="410" y="380" text-anchor="middle" class="label">공유 자원</text>
  <text x="410" y="410" text-anchor="middle" class="small">원탁</text>

  <g>
    <circle cx="410" cy="160" r="48" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><text x="410" y="167" text-anchor="middle" class="label">T1</text>
    <circle cx="625" cy="315" r="48" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><text x="625" y="322" text-anchor="middle" class="label">T2</text>
    <circle cx="545" cy="570" r="48" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><text x="545" y="577" text-anchor="middle" class="label">T3</text>
    <circle cx="275" cy="570" r="48" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><text x="275" y="577" text-anchor="middle" class="label">T4</text>
    <circle cx="195" cy="315" r="48" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><text x="195" y="322" text-anchor="middle" class="label">T5</text>
  </g>

  <g stroke="#374151" stroke-width="8" stroke-linecap="round">
    <line x1="520" y1="205" x2="555" y2="245"/>
    <line x1="600" y1="450" x2="565" y2="485"/>
    <line x1="385" y1="590" x2="335" y2="590"/>
    <line x1="220" y1="455" x2="190" y2="420"/>
    <line x1="285" y1="215" x2="325" y2="195"/>
  </g>
  <g fill="#dc2626" font-size="18" font-weight="700">
    <text x="550" y="195">Lock A</text><text x="610" y="480">Lock B</text><text x="360" y="625">Lock C</text><text x="125" y="470">Lock D</text><text x="245" y="180">Lock E</text>
  </g>

  <rect x="720" y="145" width="430" height="420" rx="18" fill="#fff7f7" stroke="#dc2626" stroke-width="3"/>
  <text x="935" y="195" text-anchor="middle" class="label" fill="#b91c1c">MULTI_THREAD_ENABLE=True</text>
  <text x="755" y="250" class="small">1. 각 Thread가 공유 자원 하나를 먼저 점유</text>
  <text x="755" y="300" class="small">2. 작업 완료를 위해 옆 Thread의 자원이 필요</text>
  <text x="755" y="350" class="small">3. 상대 Thread도 자원을 놓지 않고 기다림</text>
  <text x="755" y="400" class="small">4. 서로 WAITING / BLOCKED 상태가 연결됨</text>
  <text x="755" y="450" class="small">5. 순환 대기(Circular Wait) 형성</text>
  <text x="755" y="515" class="label" fill="#b91c1c">결과: PID는 살아 있지만 작업은 멈춤</text>

  <rect x="160" y="630" width="880" height="58" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="668" text-anchor="middle" class="note">핵심: 모두가 자원 하나를 쥔 채 다음 자원을 기다리면 아무도 작업을 끝낼 수 없다.</text>
</svg>