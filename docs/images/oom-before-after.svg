<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; fill:#111827; }
    .title{font-size:46px;font-weight:800}.sub{font-size:24px;fill:#4b5563}.h{font-size:30px;font-weight:800;fill:white}
    .step{font-size:25px;font-weight:700}.small{font-size:22px}.note{font-size:24px;font-weight:700}.mono{font-size:23px;font-family:monospace}
  </style>
  <text x="600" y="62" text-anchor="middle" class="title">OOM Before / After</text>
  <text x="600" y="98" text-anchor="middle" class="sub">MEMORY_LIMIT 변경에 따른 프로세스 동작 차이</text>

  <rect x="45" y="130" width="530" height="450" rx="18" fill="#fff7f7" stroke="#dc2626" stroke-width="3"/>
  <rect x="45" y="130" width="530" height="62" rx="18" fill="#dc2626"/>
  <rect x="45" y="174" width="530" height="18" fill="#dc2626"/>
  <text x="310" y="172" text-anchor="middle" class="h">Before</text>
  <text x="85" y="232" class="step">1. MEMORY_LIMIT = 256MB</text>
  <text x="85" y="282" class="step">2. Heap 25MB → 275MB</text>
  <text x="85" y="332" class="step">3. MemoryGuard 동작</text>
  <text x="85" y="382" class="step">4. SELF-TERMINATED</text>
  <text x="85" y="432" class="step">5. Killed</text>
  <line x1="360" y1="258" x2="505" y2="258" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="432" y="246" text-anchor="middle" class="small" fill="#dc2626">256MB 제한 초과</text>
  <rect x="390" y="280" width="105" height="200" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <rect x="410" y="315" width="65" height="150" rx="10" fill="#ef4444"/>
  <text x="442" y="307" text-anchor="middle" class="small" fill="#b91c1c">275MB</text>
  <text x="310" y="535" text-anchor="middle" class="note" fill="#b91c1c">제한 초과 → 보호 종료</text>

  <rect x="625" y="130" width="530" height="450" rx="18" fill="#f4fff8" stroke="#059669" stroke-width="3"/>
  <rect x="625" y="130" width="530" height="62" rx="18" fill="#059669"/>
  <rect x="625" y="174" width="530" height="18" fill="#059669"/>
  <text x="890" y="172" text-anchor="middle" class="h">After</text>
  <text x="665" y="232" class="step">1. MEMORY_LIMIT = 512MB</text>
  <text x="665" y="282" class="step">2. Heap 25MB → 525MB</text>
  <text x="665" y="332" class="step">3. Cleanup 시작</text>
  <text x="665" y="382" class="step">4. Memory Cache Flushed</text>
  <text x="665" y="432" class="step">5. Process Stabilized</text>
  <text x="665" y="482" class="step">6. 프로세스 계속 생존</text>
  <line x1="940" y1="258" x2="1085" y2="258" stroke="#059669" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="1012" y="246" text-anchor="middle" class="small" fill="#047857">512MB 도달</text>
  <rect x="970" y="280" width="105" height="200" rx="16" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <rect x="990" y="305" width="65" height="160" rx="10" fill="#10b981"/>
  <text x="1022" y="297" text-anchor="middle" class="small" fill="#047857">525MB</text>
  <text x="890" y="535" text-anchor="middle" class="note" fill="#047857">Cleanup → 안정화</text>

  <rect x="115" y="610" width="970" height="60" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="649" text-anchor="middle" class="note">결론: 256MB → 512MB로 늘리면 조기 종료는 줄지만, 메모리 증가 원인은 별도 분석이 필요</text>
</svg>