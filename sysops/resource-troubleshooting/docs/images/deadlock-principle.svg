<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <defs>
    <style>
      .title{font:700 42px sans-serif;fill:#0b2545}.sub{font:600 22px sans-serif;fill:#334155}.h{font:700 28px sans-serif}.t{font:600 22px sans-serif;fill:#1e293b}.small{font:600 19px sans-serif;fill:#475569}.white{fill:#fff}.red{fill:#b91c1c}.green{fill:#047857}.blue{fill:#1d4ed8}
    </style>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#dc2626"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="900" height="900" rx="28" fill="#f8fafc"/>
  <rect x="20" y="20" width="860" height="110" rx="24" fill="#0b3a6e"/>
  <text x="450" y="72" text-anchor="middle" class="white" style="font:700 38px sans-serif">교착 상태(Deadlock) 발생 원리</text>
  <text x="450" y="108" text-anchor="middle" class="white" style="font:600 20px sans-serif">상호 배제 + 순환 대기가 동시에 형성되면 작업이 멈춥니다.</text>

  <rect x="45" y="160" width="810" height="145" rx="22" fill="#fee2e2" stroke="#fecaca"/>
  <circle cx="105" cy="215" r="36" fill="#dc2626"/><text x="105" y="224" text-anchor="middle" class="white" style="font:700 28px sans-serif">1</text>
  <text x="165" y="205" class="h red">상호 배제 (Mutual Exclusion)</text>
  <text x="165" y="248" class="t">하나의 공유 자원(Lock)은 한 번에 하나의 Thread만 사용합니다.</text>
  <text x="165" y="278" class="small">→ Thread가 Lock을 잡으면 다른 Thread는 사용할 수 없습니다.</text>

  <rect x="45" y="330" width="810" height="145" rx="22" fill="#dcfce7" stroke="#bbf7d0"/>
  <circle cx="105" cy="385" r="36" fill="#059669"/><text x="105" y="394" text-anchor="middle" class="white" style="font:700 28px sans-serif">2</text>
  <text x="165" y="375" class="h green">순환 대기 (Circular Wait)</text>
  <text x="165" y="418" class="t">각 Thread가 자신이 가진 Lock을 놓지 않고 서로의 Lock을 기다립니다.</text>
  <text x="165" y="448" class="small">→ 대기 관계가 원형으로 이어지면 누구도 작업을 진행할 수 없습니다.</text>

  <rect x="70" y="520" width="285" height="205" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="70" y="520" width="285" height="55" rx="22" fill="#1d4ed8"/>
  <text x="212" y="557" text-anchor="middle" class="white" style="font:700 26px sans-serif">Thread-1</text>
  <text x="212" y="620" text-anchor="middle" class="t">Lock A 보유</text>
  <text x="212" y="665" text-anchor="middle" class="red" style="font:700 24px sans-serif">Lock B 대기</text>
  <text x="212" y="701" text-anchor="middle" class="small">A를 놓지 않은 상태</text>

  <rect x="545" y="520" width="285" height="205" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="545" y="520" width="285" height="55" rx="22" fill="#1d4ed8"/>
  <text x="687" y="557" text-anchor="middle" class="white" style="font:700 26px sans-serif">Thread-2</text>
  <text x="687" y="620" text-anchor="middle" class="t">Lock B 보유</text>
  <text x="687" y="665" text-anchor="middle" class="blue" style="font:700 24px sans-serif">Lock A 대기</text>
  <text x="687" y="701" text-anchor="middle" class="small">B를 놓지 않은 상태</text>

  <path d="M355 595 C430 545 470 545 545 595" fill="none" stroke="#dc2626" stroke-width="7" marker-end="url(#arrowRed)"/>
  <text x="450" y="555" text-anchor="middle" class="red" style="font:700 20px sans-serif">B를 기다림</text>
  <path d="M545 675 C470 735 430 735 355 675" fill="none" stroke="#2563eb" stroke-width="7" marker-end="url(#arrowBlue)"/>
  <text x="450" y="735" text-anchor="middle" class="blue" style="font:700 20px sans-serif">A를 기다림</text>

  <circle cx="450" cy="635" r="78" fill="#dc2626"/>
  <text x="450" y="625" text-anchor="middle" class="white" style="font:700 25px sans-serif">순환 대기</text>
  <text x="450" y="660" text-anchor="middle" class="white" style="font:700 29px sans-serif">Deadlock</text>

  <rect x="45" y="775" width="810" height="90" rx="22" fill="#ecfdf5" stroke="#86efac"/>
  <text x="450" y="815" text-anchor="middle" class="green" style="font:700 27px sans-serif">상호 배제로 Lock을 독점한 Thread들이 서로 기다리면</text>
  <text x="450" y="850" text-anchor="middle" class="red" style="font:700 29px sans-serif">순환 대기 → Deadlock</text>
</svg>