<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900"><rect width="900" height="900" rx="28" fill="#f8fafc"/><rect x="20" y="20" width="860" height="110" rx="24" fill="#0b3a6e"/><text x="450" y="72" text-anchor="middle" fill="#fff" style="font:700 38px sans-serif">교착 상태(Deadlock) 발생 원리</text><text x="450" y="108" text-anchor="middle" fill="#fff" style="font:600 20px sans-serif">상호 배제 + 순환 대기가 동시에 형성되면 작업이 멈춥니다.</text><rect x="45" y="160" width="810" height="145" rx="22" fill="#fee2e2" stroke="#fecaca"/><text x="85" y="215" fill="#b91c1c" style="font:700 28px sans-serif">1. 상호 배제 (Mutual Exclusion)</text><text x="85" y="258" fill="#1e293b" style="font:600 22px sans-serif">하나의 공유 자원(Lock)은 한 번에 하나의 Thread만 사용합니다.</text><rect x="45" y="330" width="810" height="145" rx="22" fill="#dcfce7" stroke="#bbf7d0"/><text x="85" y="385" fill="#047857" style="font:700 28px sans-serif">2. 순환 대기 (Circular Wait)</text><text x="85" y="428" fill="#1e293b" style="font:600 22px sans-serif">각 Thread가 자신이 가진 Lock을 놓지 않고 서로의 Lock을 기다립니다.</text><rect x="70" y="525" width="285" height="190" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="212" y="575" text-anchor="middle" fill="#1d4ed8" style="font:700 27px sans-serif">Thread-1</text><text x="212" y="625" text-anchor="middle" fill="#1e293b" style="font:600 23px sans-serif">Lock A 보유</text><text x="212" y="670" text-anchor="middle" fill="#b91c1c" style="font:700 24px sans-serif">→ Lock B 대기</text><rect x="545" y="525" width="285" height="190" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="687" y="575" text-anchor="middle" fill="#1d4ed8" style="font:700 27px sans-serif">Thread-2</text><text x="687" y="625" text-anchor="middle" fill="#1e293b" style="font:600 23px sans-serif">Lock B 보유</text><text x="687" y="670" text-anchor="middle" fill="#1d4ed8" style="font:700 24px sans-serif">→ Lock A 대기</text><circle cx="450" cy="620" r="82" fill="#dc2626"/><text x="450" y="612" text-anchor="middle" fill="#fff" style="font:700 25px sans-serif">순환 대기</text><text x="450" y="650" text-anchor="middle" fill="#fff" style="font:700 30px sans-serif">Deadlock</text><rect x="45" y="765" width="810" height="95" rx="22" fill="#ecfdf5" stroke="#86efac"/><text x="450" y="810" text-anchor="middle" fill="#047857" style="font:700 26px sans-serif">상호 배제로 자원을 독점한 Thread들이 서로 기다리면</text><text x="450" y="845" text-anchor="middle" fill="#b91c1c" style="font:700 30px sans-serif">순환 대기 → Deadlock</text></svg>