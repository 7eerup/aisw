<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <rect width="900" height="600" rx="24" fill="#f8fafc"/>

  <rect x="20" y="20" width="860" height="88" rx="20" fill="#0b3a6e"/>
  <text x="450" y="58" text-anchor="middle" fill="#fff" style="font:700 32px sans-serif">교착 상태(Deadlock) 발생 원리</text>
  <text x="450" y="88" text-anchor="middle" fill="#fff" style="font:600 18px sans-serif">상호 배제 + 순환 대기가 동시에 형성되면 작업이 멈춥니다.</text>

  <rect x="40" y="130" width="385" height="135" rx="20" fill="#fee2e2" stroke="#fecaca"/>
  <text x="70" y="174" fill="#b91c1c" style="font:700 25px sans-serif">1. 상호 배제</text>
  <text x="70" y="205" fill="#b91c1c" style="font:700 18px sans-serif">Mutual Exclusion</text>
  <text x="70" y="239" fill="#1e293b" style="font:600 18px sans-serif">하나의 Lock은 한 번에</text>
  <text x="70" y="260" fill="#1e293b" style="font:600 18px sans-serif">하나의 Thread만 사용</text>

  <rect x="475" y="130" width="385" height="135" rx="20" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="505" y="174" fill="#047857" style="font:700 25px sans-serif">2. 순환 대기</text>
  <text x="505" y="205" fill="#047857" style="font:700 18px sans-serif">Circular Wait</text>
  <text x="505" y="239" fill="#1e293b" style="font:600 18px sans-serif">각 Thread가 Lock을 보유한 채</text>
  <text x="505" y="260" fill="#1e293b" style="font:600 18px sans-serif">서로의 Lock을 기다림</text>

  <rect x="55" y="310" width="280" height="145" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="195" y="350" text-anchor="middle" fill="#1d4ed8" style="font:700 24px sans-serif">Thread-1</text>
  <text x="195" y="390" text-anchor="middle" fill="#1e293b" style="font:600 21px sans-serif">Lock A 보유</text>
  <text x="195" y="425" text-anchor="middle" fill="#b91c1c" style="font:700 21px sans-serif">→ Lock B 대기</text>

  <rect x="565" y="310" width="280" height="145" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="705" y="350" text-anchor="middle" fill="#1d4ed8" style="font:700 24px sans-serif">Thread-2</text>
  <text x="705" y="390" text-anchor="middle" fill="#1e293b" style="font:600 21px sans-serif">Lock B 보유</text>
  <text x="705" y="425" text-anchor="middle" fill="#1d4ed8" style="font:700 21px sans-serif">→ Lock A 대기</text>

  <path d="M335 350 C405 305 495 305 565 350" fill="none" stroke="#dc2626" stroke-width="6"/>
  <polygon points="554,338 575,350 554,362" fill="#dc2626"/>
  <path d="M565 420 C495 465 405 465 335 420" fill="none" stroke="#2563eb" stroke-width="6"/>
  <polygon points="346,408 325,420 346,432" fill="#2563eb"/>

  <circle cx="450" cy="385" r="76" fill="#dc2626"/>
  <text x="450" y="376" text-anchor="middle" fill="#fff" style="font:700 23px sans-serif">순환 대기</text>
  <text x="450" y="412" text-anchor="middle" fill="#fff" style="font:700 28px sans-serif">Deadlock</text>

  <rect x="40" y="495" width="820" height="75" rx="18" fill="#ecfdf5" stroke="#86efac"/>
  <text x="450" y="528" text-anchor="middle" fill="#047857" style="font:700 22px sans-serif">상호 배제로 자원을 독점한 Thread들이 서로 기다리면</text>
  <text x="450" y="557" text-anchor="middle" fill="#b91c1c" style="font:700 25px sans-serif">순환 대기 → Deadlock</text>
</svg>